server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html/browser;
    
    # Disable nginx version header
    server_tokens off;
    
    # Handle ALL Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy - will be overridden by ConfigMap
    location /api {
        # This will be replaced by ConfigMap
        return 500 "API proxy not configured\n";
        add_header Content-Type text/plain;
    }
    location /metrics {
        return 200 "# HELP nginx_up Nginx server status\n# TYPE nginx_up gauge\nnginx_up 1\n";
        add_header Content-Type text/plain;
    }

}